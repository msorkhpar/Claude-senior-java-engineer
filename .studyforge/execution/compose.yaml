name: "${STUDYFORGE_PROJECT:-studyforge-claude-senior-java-engineer-interview-preparation}"
services:
  editor:
    image: "${EDITOR_IMAGE:?build it with docker/editor/build.py and pin the tag it prints}"
    container_name: "${STUDYFORGE_EDITOR_NAME:-studyforge-claude-senior-java-engineer-interview-preparation-editor-1}"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    read_only: false
    ports:
      - "127.0.0.1:${STUDYFORGE_EDITOR_PORT:-8443}:8080"
    environment:
      GRADLE_USER_HOME: /home/coder/.gradle
    command:
      - --auth=none
      - "--bind-addr=0.0.0.0:8080"
      - --extensions-dir=/opt/code-server/extensions
      - --disable-workspace-trust
      - --disable-telemetry
      - --disable-update-check
      - /home/coder/repo
    tmpfs:
      - /home/coder/repo
    volumes:
      - "../../.studyforge/execution/code:/home/coder/repo/sources"
      - "editor-config:/home/coder/.config"
      - "editor-data:/home/coder/.local"
      - "maven-repo:/home/coder/.m2"
      - "../../practice:/home/coder/repo/practice"
    healthcheck:
      test:
        - CMD
        - /usr/lib/code-server/lib/node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.status === 200 ? 0 : 1), () => process.exit(1))"
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
      retries: 3
    restart: "no"
    depends_on:
      preflight:
        condition: service_completed_successfully
        required: "${STUDYFORGE_PREFLIGHT:-false}"
  runner:
    image: "${STUDYFORGE_RUNNER_IMAGE:?record the primed runner's tag with the execution skill; it writes STUDYFORGE_RUNNER_IMAGE}"
    container_name: "${STUDYFORGE_RUNNER_NAME:-studyforge-runner-claude-senior-java-engineer-interview-preparation}"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    volumes:
      - "../..:/work"
      - "./runservice.pl:/opt/studyforge/runservice.pl:ro"
    restart: "no"
    command:
      - perl
      - /opt/studyforge/runservice.pl
    networks:
      - runs
    depends_on:
      preflight:
        condition: service_completed_successfully
        required: "${STUDYFORGE_PREFLIGHT:-false}"
  preflight:
    image: "${STUDYFORGE_SITE_IMAGE:-}"
    profiles:
      - site
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command:
      - preflight
      - /corpus
    volumes:
      - "../..:/corpus:ro"
    network_mode: "none"
    restart: "no"
  site:
    image: "${STUDYFORGE_SITE_IMAGE:-}"
    profiles:
      - site
    container_name: "${STUDYFORGE_SITE_NAME:-studyforge-site-claude-senior-java-engineer-interview-preparation}"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command:
      - serve
      - /corpus
      - --published
      - --port
      - "${STUDYFORGE_SITE_PORT:-8765}"
    ports:
      - "127.0.0.1:${STUDYFORGE_SITE_PORT:-8765}:${STUDYFORGE_SITE_PORT:-8765}"
    environment:
      STUDYFORGE_EDITOR_ORIGIN: "http://127.0.0.1:${STUDYFORGE_EDITOR_PORT:-8443}"
      STUDYFORGE_EDITOR_BINDS: .studyforge/execution/code=/home/coder/repo/sources;practice=/home/coder/repo/practice
      STUDYFORGE_EDITOR_HEALTH: "http://editor:8080/healthz"
      STUDYFORGE_RUN_SERVICE: runner
      PYTHONDONTWRITEBYTECODE: 1
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${STUDYFORGE_SITE_PORT:-8765}/', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    volumes:
      - "../..:/corpus"
    networks:
      - default
      - runs
    restart: "no"
    depends_on:
      preflight:
        condition: service_completed_successfully
        required: "${STUDYFORGE_PREFLIGHT:-false}"
networks:
  runs:
    internal: true
volumes:
  editor-config: {}
  editor-data: {}
  maven-repo: {}

# ⛔ Spec §8.1: every bind source below exists on the host BEFORE this
# file is brought up. Docker creates a missing one root-owned, and the
# container can then never write it:
#   - ../../.studyforge/execution/code
#   - ../../practice
