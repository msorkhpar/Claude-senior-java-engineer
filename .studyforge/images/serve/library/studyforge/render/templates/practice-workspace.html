<div data-workspace role="dialog" aria-modal="true" aria-labelledby="practice-workspace-title" hidden>
<div data-workspace-part="bar"><button type="button" data-workspace-act="statement" aria-expanded="true" hidden><span data-workspace-word="hide">Hide description</span><span data-workspace-word="show" hidden>Show description</span></button><h2 id="practice-workspace-title" data-workspace-part="title"></h2>
<p data-workspace-part="acts"><button type="button" data-workspace-act="previous">Previous</button><button type="button" data-workspace-act="next">Next</button><button type="button" data-workspace-act="close">Close</button></p></div>
<div data-workspace-part="divider" role="separator" aria-orientation="vertical" aria-label="Resize the description" tabindex="0" hidden></div>
<button type="button" data-workspace-act="reopen" aria-expanded="false" hidden><span data-workspace-part="edge-mark" aria-hidden="true">&#8250;</span><span data-workspace-part="edge-word">Show description</span></button>
</div>
