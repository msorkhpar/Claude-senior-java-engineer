<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f5f9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a">
<script>try{var t=sessionStorage.getItem("studyforge.boot.theme.v1");if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);}}catch(e){}</script>
<title>${title}</title>
<link rel="stylesheet" href="${stylesheet}">
${identity}</head>
<body>
<a href="#content">Skip to the content</a>
<header>
<div role="group" aria-label="Theme" data-section="theme" hidden>
<button type="button" data-theme-choice="system" aria-pressed="true">System</button>
<button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
<button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
</div>
${breadcrumb}<h1${headingattributes}>${heading}</h1>
${meta}</header>
${rail}${outline}<main id="content">
${body}
</main>
${pending}${mark}${player}${nav}<script src="${script}" defer></script>
</body>
</html>
