name: "${COURSE_PROJECT:-claude-senior-java-engineer-interview-preparation}"
services:
  serve-base:
    image: "${STUDYFORGE_NAMESPACE:-studyforge-local}/studyforge-serve:0.1.0-c564f0b978bf9bc8e710262a8c42661129a7d113184f27f216979af5f04938de"
    build:
      context: .studyforge/images/serve
    scale: 0
  runner-base:
    image: "${STUDYFORGE_NAMESPACE:-studyforge-local}/studyforge-runner:java-maven-amd64-f8f1db0be48a"
    build:
      context: .studyforge/images/toolchain
      dockerfile: docker/minimal/Dockerfile
      target: runner
      args:
        CACHE_KEY: "code-server-toolchain/runner:java-maven-amd64-f8f1db0be48a"
        CHECKS: "java|java -version|25.0.4+7\nmaven|mvn -v|Apache Maven 3.9.16"
        DECLARED: java maven
        JAVA_IMAGE: "eclipse-temurin:25.0.4_7-jdk@sha256:97014c4b396021f9ddb7d592a7dbedb0c4e4215c29e03dc01c393558aefb71c2"
        MAVEN_SHA256: 80ffca22aed9e8b9713a232f3394fd81d7f20322df75efdb2b047dbd3e3a23bb
        MAVEN_URL: "https://repo1.maven.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz"
        OPT_EXPECTED: java maven maven-repo
        PRIME_GRADLE_HOME: /tmp/.gradle
        PRIME_MAVEN_ARGS: ""
        PYTEST_REQUIREMENTS: "pytest==9.1.1 --hash=sha256:37a86b45efb9a47a61a36449063e8e18d0cab3161329fc099eb21783169c4f0c\niniconfig==2.3.0 --hash=sha256:f631c04d2c48c52b84d0d0549c99ff3859c98df65b3101406327ecc7d53fbf12\npackaging==26.3 --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c\npluggy==1.6.0 --hash=sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746\npygments==2.21.0 --hash=sha256:2363c69b61c4a97c838da3b130dcd6468f4848992b21a82f2a63ec34377137d9"
        RUNNER_BASE: "debian:trixie-20260824-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132"
        RUNNER_HOME: /tmp
        SQLITE_PACKAGES: libsqlite3-0=3.46.1-7+deb13u1 sqlite3=3.46.1-7+deb13u1
        SQLITE_SNAPSHOT: 20260824T000000Z
        UNPACK_IMAGE: "python:3.14.7-slim-trixie@sha256:cad9a2c871761c413caa6fdd6441c783451e740a48aaeba60ae62a8b53525ef6"
        WITH_GRADLE: "no"
        WITH_GRADLE_PRIME: "no"
        WITH_JAVA: "yes"
        WITH_KOTLIN: "no"
        WITH_MAVEN: "yes"
        WITH_MAVENREPO: "yes"
        WITH_MAVEN_PRIME: "no"
        WITH_NODE: "no"
        WITH_PYTHON: "no"
        WITH_SQLITE: "no"
      additional_contexts:
        consumer-prime: .studyforge/images/toolchain/no-prime
    scale: 0
  editor-base:
    image: "${STUDYFORGE_NAMESPACE:-studyforge-local}/studyforge-editor:java-maven-amd64-1039938419bb"
    build:
      context: .studyforge/images/toolchain
      dockerfile: docker/editor/Dockerfile
      target: editor
      args:
        CHECKS: "java|java -version|25.0.4+7\nmaven|mvn -v|Apache Maven 3.9.16"
        DECLARED: java maven
        EDITOR_BASE: "codercom/code-server:4.137.0@sha256:57ac684d44deb6fa94317b3e8f3e128dd7fb897fffd95b4efcd16f56ce607971"
        EDITOR_PATH: "/opt/java/openjdk/bin:/opt/maven/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        EXPECTED_EXTENSIONS: redhat.java@1.56.0 studyforge.practice-focus@1.0.0 vscjava.vscode-java-debug@0.59.0 vscjava.vscode-java-test@0.46.0
        FACE_FILES: "fonts/webfonts/JetBrainsMono-Regular.woff2|400|a9cb1cd82332b23a47e3a1239d25d13c86d16c4220695e34b243effa999f45f2\nfonts/webfonts/JetBrainsMono-Bold.woff2|700|c503cc5ec5f8b2c7666b7ecda1adf44bd45f2e6579b2eba0fc292150416588a2\nOFL.txt|licence|30f0c136e3c88e422d0791acd97238870f9054a9729bc34cf2ff0d4ed8cac4ad"
        FACE_SHA256: 6f6376c6ed2960ea8a963cd7387ec9d76e3f629125bc33d1fdcd7eb7012f7bbf
        FACE_URL: "https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip"
        FETCH: "redhat.java-1.56.0.vsix|https://open-vsx.org/api/redhat/java/1.56.0/file/redhat.java-1.56.0.vsix|3c6a821d7612eb879fa40280b6c585342eec82d6b1b3e8dcfe4d0395e0624343\nvscjava.vscode-java-debug-0.59.0.vsix|https://open-vsx.org/api/vscjava/vscode-java-debug/0.59.0/file/vscjava.vscode-java-debug-0.59.0.vsix|87627e24dbb5b01137decc0265f043cb08adad22af3c195f1ba39898dafb1588\nvscjava.vscode-java-test-0.46.0.vsix|https://open-vsx.org/api/vscjava/vscode-java-test/0.46.0/file/vscjava.vscode-java-test-0.46.0.vsix|56c1e14dc73a30e9574c47042106fa52893bf8325b580f47c14ace07d5eef255"
        FETCH_IMAGE: "python:3.14.7-slim-trixie@sha256:cad9a2c871761c413caa6fdd6441c783451e740a48aaeba60ae62a8b53525ef6"
        JAVA_HOME_DIR: /opt/java/openjdk
        JAVA_RUNTIME: JavaSE-25
        LOCKDOWN_VSIX: studyforge.practice-focus-1.0.0.vsix
        OPT_EXPECTED: code-server java maven maven-repo
        PRIME_KEY: "none"
        PROFILE_D: "export JAVA_HOME=/opt/java/openjdk\nexport PATH=/opt/java/openjdk/bin:/opt/maven/bin:$$PATH"
        READLINE_PACKAGES: libreadline8t64=8.2-6 readline-common=8.2-6
        READLINE_SNAPSHOT: 20260824T000000Z
        RUNNER_IMAGE: studyforge-runner-base
        SEED_DROP: python
        WITH_GRADLE_PRIME: "no"
        WITH_JAVA: "yes"
        WITH_MAVEN_PRIME: "no"
        WITH_READLINE: "no"
        WITH_TYPESCRIPT: "no"
      additional_contexts:
        consumer-prime: .studyforge/images/toolchain/no-prime
        studyforge-runner-base: "service:runner-base"
    scale: 0
  runner-prime:
    build:
      context: .studyforge/images/toolchain
      dockerfile: docker/prime/Dockerfile
      target: runner-prime
      args:
        BASE_IMAGE: studyforge-runner-base
        PRIME_GRADLE_HOME: /tmp/.gradle
        PRIME_KEY: 4143f0f67875a5bc0c239369aefa69a2750cffb572a27e38a7827092482154d6
        PRIME_MAVEN_ARGS: -Dmaven.repo.local=/opt/prime/maven-repo
        WITH_GRADLE_PRIME: "no"
        WITH_MAVEN_PRIME: "yes"
      additional_contexts:
        consumer-prime: .studyforge/execution/prime
        studyforge-runner-base: "service:runner-base"
    scale: 0
  site:
    build:
      context: .
      dockerfile: .studyforge/images/site/Dockerfile
      target: "${COURSE_NARRATION:-without-narration}"
      args:
        SERVE_BASE: studyforge-serve-base
      additional_contexts:
        studyforge-serve-base: "service:serve-base"
    image: "${STUDYFORGE_NAMESPACE:-studyforge-local}/claude-senior-java-engineer-interview-preparation-site:502ddf424dd5-0466917b8148-${COURSE_NARRATION:-without-narration}"
    user: "1000:1000"
    command:
      - serve
      - /corpus
      - --published
      - --port
      - "${COURSE_SITE_PORT:-8772}"
    ports:
      - "127.0.0.1:${COURSE_SITE_PORT:-8772}:${COURSE_SITE_PORT:-8772}"
    environment:
      STUDYFORGE_EDITOR_ORIGIN: "http://127.0.0.1:${COURSE_EDITOR_PORT:-8444}"
      STUDYFORGE_EDITOR_BINDS: .studyforge/execution/code=/home/coder/repo/sources;practice=/home/coder/repo/practice
      STUDYFORGE_EDITOR_HEALTH: "http://editor:8080/healthz"
      STUDYFORGE_RUN_SERVICE: runner
      PYTHONDONTWRITEBYTECODE: 1
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${COURSE_SITE_PORT:-8772}/', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    volumes:
      - "code:/corpus/.studyforge/execution/code"
      - "practice:/corpus/practice"
      - "allowed:/corpus/.studyforge/execution/allowed"
      - "progress:/corpus/.studyforge/progress"
    networks:
      - default
      - runs
    restart: "no"
  runner:
    build:
      context: .
      dockerfile: .studyforge/images/runner/Dockerfile
      args:
        RUNNER_PRIMED: course-runner-prime
      additional_contexts:
        course-runner-prime: "service:runner-prime"
    image: "${STUDYFORGE_NAMESPACE:-studyforge-local}/claude-senior-java-engineer-interview-preparation-runner:502ddf424dd5"
    user: "1000:1000"
    init: true
    volumes:
      - "code:/work/.studyforge/execution/code"
      - "practice:/work/practice"
      - "allowed:/work/.studyforge/execution/allowed:ro"
    labels:
      org.studyforge.binds: =/work
    networks:
      - runs
    depends_on:
      site:
        condition: service_healthy
    restart: "no"
  editor:
    build:
      context: .studyforge/images/toolchain
      dockerfile: docker/prime/Dockerfile
      target: editor-prime
      args:
        BASE_IMAGE: studyforge-editor-base
        PRIME_GRADLE_HOME: /tmp/.gradle
        PRIME_KEY: 4143f0f67875a5bc0c239369aefa69a2750cffb572a27e38a7827092482154d6
        PRIME_MAVEN_ARGS: -Dmaven.repo.local=/opt/prime/maven-repo
        WITH_GRADLE_PRIME: "no"
        WITH_MAVEN_PRIME: "yes"
      additional_contexts:
        consumer-prime: .studyforge/execution/prime
        studyforge-editor-base: "service:editor-base"
    image: "${STUDYFORGE_NAMESPACE:-studyforge-local}/claude-senior-java-engineer-interview-preparation-editor:502ddf424dd5"
    labels:
      org.studyforge.binds: .studyforge/execution/code=/home/coder/repo/sources;practice=/home/coder/repo/practice
    user: "1000:1000"
    read_only: false
    ports:
      - "127.0.0.1:${COURSE_EDITOR_PORT:-8444}:8080"
    environment:
      GRADLE_USER_HOME: /home/coder/.gradle
    command:
      - --auth=none
      - "--bind-addr=0.0.0.0:8080"
      - --extensions-dir=/opt/code-server/extensions
      - --disable-workspace-trust
      - --disable-telemetry
      - --disable-update-check
      - /home/coder/repo
    tmpfs:
      - /home/coder/repo
    volumes:
      - "code:/home/coder/repo/sources"
      - "editor-config:/home/coder/.config"
      - "editor-data:/home/coder/.local"
      - "maven-repo:/home/coder/.m2"
      - "practice:/home/coder/repo/practice"
    healthcheck:
      test:
        - CMD
        - /usr/lib/code-server/lib/node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.status === 200 ? 0 : 1), () => process.exit(1))"
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
      retries: 3
    restart: "no"
    depends_on:
      site:
        condition: service_healthy
networks:
  runs:
    internal: true
volumes:
  allowed: {}
  code: {}
  editor-config: {}
  editor-data: {}
  maven-repo: {}
  practice: {}
  progress: {}
