name: "${COURSE_PROJECT:-claude-senior-java-engineer-interview-preparation}"
services:
  runner-prime:
    build:
      context: .studyforge/images/toolchain
      dockerfile: docker/prime/Dockerfile
      target: runner-prime
      args:
        BASE_IMAGE: "${STUDYFORGE_NAMESPACE:?STUDYFORGE_NAMESPACE is not set. It is the Docker Hub account the course images are published under: set it in .env (copy course.env) to the account you were given}/studyforge-code-toolchain-runner:java-maven-node-python-amd64-f8f1db0be48a@sha256:5e44745a2b055244f2b23dc006b09d6de4129a40dec50045befd7ac43bdfb8ed"
        PRIME_GRADLE_HOME: /tmp/.gradle
        PRIME_KEY: 4143f0f67875a5bc0c239369aefa69a2750cffb572a27e38a7827092482154d6
        PRIME_MAVEN_ARGS: -Dmaven.repo.local=/opt/prime/maven-repo
        WITH_GRADLE_PRIME: "no"
        WITH_MAVEN_PRIME: "yes"
      additional_contexts:
        consumer-prime: .studyforge/execution/prime
    scale: 0
  site:
    build:
      context: .
      dockerfile: .studyforge/images/site/Dockerfile
      target: "${COURSE_NARRATION:-without-narration}"
      args:
        STUDYFORGE_NAMESPACE: "${STUDYFORGE_NAMESPACE:?STUDYFORGE_NAMESPACE is not set. It is the Docker Hub account the course images are published under: set it in .env (copy course.env) to the account you were given}"
    image: "${STUDYFORGE_NAMESPACE:?STUDYFORGE_NAMESPACE is not set. It is the Docker Hub account the course images are published under: set it in .env (copy course.env) to the account you were given}/claude-senior-java-engineer-interview-preparation-site:6d1626673921-2b8f2b53be46-${COURSE_NARRATION:-without-narration}"
    user: "1000:1000"
    command:
      - serve
      - /corpus
      - --published
      - --port
      - "${COURSE_SITE_PORT:-8772}"
    ports:
      - "127.0.0.1:${COURSE_SITE_PORT:-8772}:${COURSE_SITE_PORT:-8772}"
    environment:
      STUDYFORGE_EDITOR_ORIGIN: "http://127.0.0.1:${COURSE_EDITOR_PORT:-8444}"
      STUDYFORGE_EDITOR_BINDS: .studyforge/execution/code=/home/coder/repo/sources;practice=/home/coder/repo/practice
      STUDYFORGE_EDITOR_HEALTH: "http://editor:8080/healthz"
      STUDYFORGE_RUN_SERVICE: runner
      PYTHONDONTWRITEBYTECODE: 1
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${COURSE_SITE_PORT:-8772}/', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    volumes:
      - "code:/corpus/.studyforge/execution/code"
      - "practice:/corpus/practice"
      - "allowed:/corpus/.studyforge/execution/allowed"
      - "progress:/corpus/.studyforge/progress"
    networks:
      - default
      - runs
    restart: "no"
  runner:
    build:
      context: .
      dockerfile: .studyforge/images/runner/Dockerfile
      args:
        RUNNER_PRIMED: course-runner-prime
      additional_contexts:
        course-runner-prime: "service:runner-prime"
    image: "${STUDYFORGE_NAMESPACE:?STUDYFORGE_NAMESPACE is not set. It is the Docker Hub account the course images are published under: set it in .env (copy course.env) to the account you were given}/claude-senior-java-engineer-interview-preparation-runner:6d1626673921-5e44745a2b05"
    user: "1000:1000"
    init: true
    volumes:
      - "code:/work/.studyforge/execution/code"
      - "practice:/work/practice"
      - "allowed:/work/.studyforge/execution/allowed:ro"
    labels:
      org.studyforge.binds: =/work
    networks:
      - runs
    depends_on:
      site:
        condition: service_healthy
    restart: "no"
  editor:
    build:
      context: .studyforge/images/toolchain
      dockerfile: docker/prime/Dockerfile
      target: editor-prime
      args:
        BASE_IMAGE: "${STUDYFORGE_NAMESPACE:?STUDYFORGE_NAMESPACE is not set. It is the Docker Hub account the course images are published under: set it in .env (copy course.env) to the account you were given}/studyforge-code-toolchain-editor:java-maven-node-python-amd64-14e3f747ce03@sha256:0db8c92139c27cfdd4a6783d229c512a1148b0df1099921ce3d310654b64d1db"
        PRIME_GRADLE_HOME: /tmp/.gradle
        PRIME_KEY: 4143f0f67875a5bc0c239369aefa69a2750cffb572a27e38a7827092482154d6
        PRIME_MAVEN_ARGS: -Dmaven.repo.local=/opt/prime/maven-repo
        WITH_GRADLE_PRIME: "no"
        WITH_MAVEN_PRIME: "yes"
      additional_contexts:
        consumer-prime: .studyforge/execution/prime
    image: "${STUDYFORGE_NAMESPACE:?STUDYFORGE_NAMESPACE is not set. It is the Docker Hub account the course images are published under: set it in .env (copy course.env) to the account you were given}/claude-senior-java-engineer-interview-preparation-editor:6d1626673921-0db8c92139c2"
    labels:
      org.studyforge.binds: .studyforge/execution/code=/home/coder/repo/sources;practice=/home/coder/repo/practice
    user: "1000:1000"
    read_only: false
    ports:
      - "127.0.0.1:${COURSE_EDITOR_PORT:-8444}:8080"
    environment:
      GRADLE_USER_HOME: /home/coder/.gradle
    command:
      - --auth=none
      - "--bind-addr=0.0.0.0:8080"
      - --extensions-dir=/opt/code-server/extensions
      - --disable-workspace-trust
      - --disable-telemetry
      - --disable-update-check
      - /home/coder/repo
    tmpfs:
      - /home/coder/repo
    volumes:
      - "code:/home/coder/repo/sources"
      - "editor-config:/home/coder/.config"
      - "editor-data:/home/coder/.local"
      - "maven-repo:/home/coder/.m2"
      - "practice:/home/coder/repo/practice"
    healthcheck:
      test:
        - CMD
        - /usr/lib/code-server/lib/node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.status === 200 ? 0 : 1), () => process.exit(1))"
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
      retries: 3
    restart: "no"
    depends_on:
      site:
        condition: service_healthy
networks:
  runs:
    internal: true
volumes:
  allowed: {}
  code: {}
  editor-config: {}
  editor-data: {}
  maven-repo: {}
  practice: {}
  progress: {}
